services:
  web:
    build: .
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATABASE_PATH: /app/data/data.db
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in your shell or .env}
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in your shell or .env}
    volumes:
      - icecold_data:/app/data
    restart: unless-stopped
volumes:
  icecold_data:
